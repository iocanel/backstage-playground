apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: tracker.api
  description: Tracker API used Voxxed Days Athens 2022 presentation 
spec:
  type: grpc
  lifecycle: production
  owner: Group:quarkus
  definition: |
     syntax = "proto3";
     
     import "google/protobuf/empty.proto";
     import "google/protobuf/timestamp.proto";
     
     option java_package = "org.amce.tracker";
     
     package tracker;
     
     message Position {
         double latitude = 1;
         double longitude = 2;
     }
     
     service GpsService {
             rpc track(google.protobuf.Empty) returns (stream Position);
     }
